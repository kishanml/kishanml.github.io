<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a href="#content" class="skip-link">Skip to content</a>
  <div class="page">
    <div class="container">
      {{ partial "header.html" . }}
      <main class="main" id="content">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
  </div>
</body>
</html>
